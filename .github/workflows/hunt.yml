name: hunt

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install -q requests mnemonic bip-utils

      - name: hunt
        run: python watch.py --minutes 14
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: persist state
        run: |
          git config user.name  hunt-bot
          git config user.email hunt-bot@users.noreply.github.com
          [ -f .gitignore ] || printf '__pycache__/\n' > .gitignore
          git add -A .
          git commit -m "state $(date -u +%FT%TZ)" || echo "nothing changed"
          git pull --rebase --autostash origin main || true
          git push